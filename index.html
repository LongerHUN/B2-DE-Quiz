    --history-word-color: #111827;   /* világos mód */
    --start-btn-bg: #3b82f6;
    --start-btn-text: #fff;
    --select-bg: #fff;
    --select-text: #0f172a;
    --select-border: #d1d5db;
  }

  body.dark {
    --bg-color: #1f2937;
    --box-bg: #111827;
    --text-color: #f9fafb;
    --score-color: #f9fafb;
    --option-bg: #374151;
    --option-hover: #4b5563;
    --option-correct: #16a34a;
    --option-wrong: #dc2626;
    --lesson-btn-bg: #2563eb;
    --lesson-btn-unselected: #4b5563;
    --history-bg: #1e293b;
    --history-border: #374151;
    --history-word-color: #f3f4f6;   /* sötét módhoz világosabb */
    --start-btn-bg: #2563eb;
    --start-btn-text: #f9fafb;
    --select-bg: #374151;
    --select-text: #f9fafb;
    --select-border: #4b5563;
  }

  body {
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg-color);
    color: var(--text-color);
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
  }

  .quiz-box {
    width: 480px;
    background: var(--box-bg);
    padding: 1.6rem;
    border-radius: 12px;
    box-shadow: 0 6px 20px rgba(10,10,10,0.08);
    text-align: center;
    position: relative;
  }

  /* Dark mode toggle button */
  #darkModeToggle {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 24px;
    height: 24px;
    border: none;
    border-radius: 4px;
    background: #000;
    cursor: pointer;
  }

  .topbar { display:flex; justify-content:space-between; margin-bottom:0.8rem; }
  .score, .counter { font-weight:700; color: var(--score-color); font-size:0.95rem; }
  h1 { margin:0.8rem 0 0.9rem 0; font-size:1.25rem; color: var(--text-color); }
  #options { margin-top: 0.6rem; }

  .option {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--option-bg);
    padding: 0.8rem;
    border-radius: 8px;
    margin: 0.5rem 0;
    cursor: pointer;
    user-select: none;
    transition: transform .08s ease, background .12s ease;
    border: 1px solid transparent;
    min-height: 50px;
    text-align: center;
  }

  .option:hover { transform: translateY(-2px); }
  .correct { background: var(--option-correct) !important; border-color:#34d399; }
  .wrong { background: var(--option-wrong) !important; border-color:#ff6b6b; }

  .finished { text-align:center; padding:1rem; }
  .small { font-size:0.9rem; color:#374151; }

  .lesson-btn { margin:0.2rem; padding:0.4rem 0.8rem; border:none; border-radius:6px; cursor:pointer; background: var(--lesson-btn-bg); }
  .lesson-btn.unselected { background: var(--lesson-btn-unselected); }
  select {
  margin-top: 0.5rem;
  padding: 0.4rem;
  border-radius: 6px;
  background: var(--select-bg);
  color: var(--select-text);
  border: 1px solid var(--select-border);
}
  button#startQuiz {
  margin-top:0.5rem;
  padding:0.5rem 1rem;
  cursor:pointer;
  background: var(--start-btn-bg);
  color: var(--start-btn-text);
  border: none;
  border-radius: 6px;
}

  #history {
  height:140px;
  overflow-y:auto;
  border:1px solid var(--history-border);
  padding:0.6rem;
  border-radius:8px;
  background: var(--history-bg);  /* ide jön a változó */
  box-sizing:border-box;
}

</style>

</head>

<button id="darkModeToggle"></button>

// ===== Globális változók =====
let currentQuizData = [];
let used = [];
let score = 0;
let current = 0;
let selectedLessons = [];
let numOptions = 2;
let historyList = [];


const totalEl = document.getElementById("total");
const currentEl = document.getElementById("current");
const scoreEl = document.getElementById("score");
const wordEl = document.getElementById("word");
const optionsEl = document.getElementById("options");
const lessonButtonsDiv = document.getElementById("lessonButtons");
const numOptionsSelect = document.getElementById("numOptions");

// ===== Lektionen-Buttons =====
Object.keys(data).forEach(lesson => {
  const btn = document.createElement("button");
  btn.textContent = `Lektion ${lesson}`;
  btn.classList.add("lesson-btn", "unselected"); // alapból szürke, nincs kiválasztva
  btn.dataset.lesson = lesson;
  btn.dataset.selected = "false"; // alapértelmezett: nincs kiválasztva
  btn.onclick = () => {
    btn.dataset.selected = btn.dataset.selected === "true" ? "false" : "true";
    btn.classList.toggle("unselected", btn.dataset.selected === "false");
  };
  lessonButtonsDiv.appendChild(btn);
});


document.getElementById("darkModeToggle").onclick = () => {
  document.body.classList.toggle("dark");
};

// ===== Quiz starten =====
document.getElementById("startQuiz").onclick = () => {
  selectedLessons = Array.from(lessonButtonsDiv.children)
    .filter(btn => btn.dataset.selected === "true")
    .map(btn => parseInt(btn.dataset.lesson));

  numOptions = parseInt(numOptionsSelect.value);

  currentQuizData = selectedLessons.length === 0 ? Object.values(data).flat() : selectedLessons.flatMap(l => data[l] || []);

  used = [];
  current = 0;
  score = 0;
  scoreEl.textContent = score;

  totalEl.textContent = currentQuizData.length; // teljes számláló
  currentEl.textContent = 0;

  nextQuestion();
};


// ===== Quiz-Logik =====
function safeRandomIndexFiltered(arr, excludeIndexes = []) {
  if (arr.length === 0) return -1;
  let idx;
  let tries = 0;
  do {
    idx = Math.floor(Math.random() * arr.length);
    tries++;
    if (tries > 500) break;
  } while (excludeIndexes.includes(idx));
  return idx;
}

function nextQuestion() {
  if (currentQuizData.length === 0) {
    wordEl.textContent = "Keine Wörter in den ausgewählten Lektionen.";
    optionsEl.innerHTML = "";
    currentEl.textContent = "0";
    totalEl.textContent = "0";
    return;
  }

  if (used.length === currentQuizData.length) {
    document.querySelector(".quiz-box").innerHTML = `
      <div class="finished">
        <h2>🎉 Fertig!</h2>
        <p class="small">Endstand: <strong>${score}</strong> Punkte</p>
        <p class="small">Du hast alle Fragen bearbeitet.</p>
      </div>`;
    return;
  }

  let index;
  do { index = Math.floor(Math.random() * currentQuizData.length); }
  while (used.includes(index));
  used.push(index);
  current++;

  currentEl.textContent = current;

  const [word, correct] = currentQuizData[index];
  wordEl.textContent = word;

  const options = [correct];
  while (options.length < numOptions) {
    let otherIdx = safeRandomIndexFiltered(currentQuizData, [index]);
    const def = currentQuizData[otherIdx]?.[1] || correct;
    if (!options.includes(def)) options.push(def);
  }

  options.sort(() => Math.random() - 0.5);

  optionsEl.innerHTML = "";
  options.forEach(opt => {
    const btn = document.createElement("div");
    btn.className = "option";
    btn.textContent = opt;

    btn.onclick = () => {
      const wasCorrect = opt === correct;

      historyList.push({
        word,
        answer: opt,
        correct: wasCorrect
      });
      updateHistory();

      if (wasCorrect) {
        btn.classList.add("correct");
        score += 1;
        scoreEl.textContent = score;
        setTimeout(nextQuestion, 700);
      } else {
        btn.classList.add("wrong");
        score -= 1;
        scoreEl.textContent = score;
        setTimeout(() => btn.classList.remove("wrong"), 600);
      }
    };

    optionsEl.appendChild(btn);
  });
} 

function updateHistory() {
  const historyEl = document.getElementById("history");

  // Lista fordítása, legfrissebb felül
  historyEl.innerHTML = [...historyList].reverse().map(item => {
    const answerColor = item.correct ? "#059669" : "#dc2626";

    return `
      <div style="margin-bottom:0.7rem; padding-bottom:0.4rem; border-bottom:1px solid #e5e7eb;">
        <div style="font-weight:bold; color: var(--history-word-color);">
        ${item.word}
        </div>
        <div style="margin-top:2px; color:${answerColor}; font-weight:600;">
          ${item.answer}
        </div>
      </div>
    `;
  }).join("");

  // Scroll a tetejére, hogy a legfrissebb válasz látszódjon
  historyEl.scrollTop = 0;
}


</script>
